services:
  db:
    image: postgres:15-alpine
    container_name: sql_generator_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_powered_sql
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_powered_sql"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: sql_generator_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOSTNAME=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=ai_powered_sql
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - SECRET_KEY=dev_secret_key_change_me_in_production_1234567890
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - GOOGLE_API_KEY=YOUR_GOOGLE_API_KEY_HERE
      - GEMINI_MODEL=models/gemini-3.5-flash
      - GEMINI_EMBEDDING_MODEL=models/gemini-embedding-001
      - CHROMA_PERSIST_DIR=/app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
